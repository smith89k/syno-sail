<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="L logo">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17263F"/><stop offset="1" stop-color="#070C16"/>
    </linearGradient>
    <linearGradient id="sailL" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FF6A4D"/><stop offset="1" stop-color="#E0241A"/>
    </linearGradient>
    <linearGradient id="jibL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9E2EE"/>
    </linearGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCE5F0"/><stop offset="1" stop-color="#AFBDD0"/>
    </linearGradient>
    <linearGradient id="deckL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F7FB"/><stop offset="1" stop-color="#C9D4E3"/>
