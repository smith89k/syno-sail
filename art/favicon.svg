  <g fill="#101B2E">
    <rect x="196" y="324" width="20" height="38" rx="5"/>
    <rect x="246" y="324" width="20" height="38" rx="5"/>
    <rect x="296" y="324" width="20" height="38" rx="5"/>
  </g>

  <!-- deck -->
  <rect x="146" y="286" width="228" height="20" rx="8" fill="url(#deckL)"/>

  <!-- jib -->
