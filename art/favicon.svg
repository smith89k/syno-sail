  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgL)"/><rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="6"/>

<g transform="translate(256 262) scale(1.18) translate(-256 -256)">


  <!-- hull (shipping containers / drive bays) -->
