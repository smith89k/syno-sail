<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:320px;overflow:hidden}
body{
  font-family:'Inter','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;
  background:linear-gradient(118deg,#1829437f 0%,#0B1324 42%,#06090F 100%),#070B12;
  position:relative;color:#fff;
}
.glow{position:absolute;inset:0;background:radial-gradient(760px 520px at 8% 115%,rgba(224,36,26,.30),transparent 62%),radial-gradient(620px 430px at 92% -20%,rgba(36,150,237,.22),transparent 60%);}
.deco{position:absolute;right:-70px;bottom:-120px;width:520px;height:520px;opacity:.05;
  background:url('logo-mark.svg') center/contain no-repeat;filter:grayscale(1) brightness(3);
  -webkit-mask-image:linear-gradient(105deg,transparent 8%,#000 72%);}
.wrap{position:relative;height:100%;display:flex;align-items:center;gap:44px;padding:0 70px}
.logo{width:150px;height:150px;flex:0 0 auto;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.55));}
h1{font-size:62px;font-weight:800;letter-spacing:-.035em;line-height:1;display:flex;align-items:baseline;gap:0;flex-wrap:wrap;justify-content:inherit}
.accent{background:linear-gradient(100deg,#FF7A5C,#FF2D20);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{margin-left:16px;font-size:24px;font-weight:700;letter-spacing:-.01em;padding:8px 20px 10px;border-radius:999px;
  border:2px solid rgba(255,255,255,.28);color:#E7EEF7;transform:translateY(-6px)}
p.tag{font-size:22px;font-weight:450;color:#8FA4C0;letter-spacing:-.012em;margin-top:16px;max-width:760px}
.chips{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;justify-content:inherit}
.chip{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;letter-spacing:.01em;
  color:#C3D2E6;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);padding:8px 16px 9px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%}
.url{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:21px;font-weight:500;
  color:rgba(255,255,255,.34);letter-spacing:.02em}
</style></head><body>
<div class="glow"></div><div class="deco"></div>
<div class="wrap"><img class="logo" src="logo.svg"><div><h1>Syno<span class="accent">Sail</span></h1><p class="tag">A production Docker stack for Laravel, made for your Synology NAS.</p><div class="chips"><span class="chip"><span class="dot" style="background:#FF4A33"></span>Laravel</span><span class="chip"><span class="dot" style="background:#2E8FE0"></span>Docker</span><span class="chip"><span class="dot" style="background:#CBD5E1"></span>Synology NAS</span></div></div></div>
</body></html>
